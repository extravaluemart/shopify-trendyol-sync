name: Shopify -> Trendyol Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run sync script
        env:
          SHOPIFY_STORE_URL:    ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          TRENDYOL_SUPPLIER_ID: ${{ secrets.TRENDYOL_SUPPLIER_ID }}
          TRENDYOL_API_KEY:     ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET:  ${{ secrets.TRENDYOL_API_SECRET }}
        run: python sync.py

      - name: Commit sync status to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sync_status.json
          git diff --staged --quiet || git commit -m "chore: update sync status [skip ci]"
          git push
